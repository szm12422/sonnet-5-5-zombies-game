name: Activity CI

on:
  pull_request:
  push:
    branches: [discord-activity, mobile-performance, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_DISCORD_CLIENT_ID: '1560032636016140449'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run activity:build
